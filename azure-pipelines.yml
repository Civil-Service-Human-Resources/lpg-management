trigger:
  branches:
    include:
    - master
    - idt-develop
    - idt-feature-LC-*
    - idt-release-v*
    - idt-hotfix-v*
  tags:
    include:
      - '*'

variables:
  - name: acr_repo_suffix
    ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags') }}:
      value: 'prod'
    ${{ else }}:
      value: 'test'

name: '$(SourceBranchName) $(Rev:r)'

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@1
    inputs:
      version: '22.23.4'
    displayName: 'Install Node.js'

  - script: |
      rm -rf node_modules
      npm ci
    displayName: 'Clean workspace and install fresh dependencies'

  - task: Npm@1
    displayName: 'Install'
    inputs:
      command: 'install'

  - task: Npm@1
    displayName: 'Test'
    inputs:
      command: 'custom'
      customCommand: 'run test:ts'

  - task: Npm@1
    displayName: 'Build'
    inputs:
      command: 'custom'
      customCommand: 'run build'

  - task: Docker@2
    inputs:
      containerRegistry: 'lpgregistry ACR'
      repository: 'lpg-management/${{ variables.acr_repo_suffix }}'
      command: 'buildAndPush'
      Dockerfile: '**/Dockerfile'
      tags: '$(Build.SourceBranchName)'
